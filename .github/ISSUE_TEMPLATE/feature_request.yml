name: Feature discussion
description: Describe a workflow problem before proposing a substantial change.
title: "[Feature] "
body:
  - type: textarea
    id: problem
    attributes:
      label: Workflow problem
      description: Describe who is affected and what is difficult today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Give a concrete example of how the workflow would improve.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or existing workaround
